services:
  - type: web
    name: lukintosh-investor-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/investor-ai/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_DATA_POLICY
        value: synthetic-only
      - key: AI_APPROVED_HOSTS
        value: integrate.api.nvidia.com
      - key: DATABASE_PATH
        value: /var/data/investor.sqlite
    disk:
      name: investor-data
      mountPath: /var/data
      sizeGB: 1
